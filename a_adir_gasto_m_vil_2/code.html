<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Nuevo Gasto - Nido</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        input:focus {
            outline: none;
            box-shadow: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background font-body min-h-screen flex flex-col pb-24 selection:bg-primary-container selection:text-on-primary-container overflow-x-hidden">
<!-- Top Navigation Area -->
<header class="flex justify-between items-center px-6 py-6 w-full z-40 sticky top-0 bg-background/80 backdrop-blur-md">
<button class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-container-low text-primary hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<h1 class="font-headline font-bold text-xl tracking-tight text-on-surface">Nuevo Gasto</h1>
<button class="w-12 h-12 flex items-center justify-center rounded-full bg-primary/10 text-primary hover:opacity-80 transition-opacity shadow-[0_4px_12px_rgba(154,68,45,0.15)]">
<span class="material-symbols-outlined" data-icon="document_scanner" data-weight="fill" style="font-variation-settings: 'FILL' 1;">document_scanner</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow px-6 space-y-8 pb-12">
<!-- Amount Input Area -->
<section class="flex flex-col items-center justify-center pt-4 pb-8">
<p class="font-label text-sm uppercase tracking-widest text-on-surface-variant/70 mb-2">Monto</p>
<div class="flex items-center justify-center border-b-2 border-surface-container-highest focus-within:border-primary transition-colors pb-2 w-3/4">
<span class="font-headline font-medium text-4xl text-on-surface-variant mr-2">$</span>
<input autofocus="" class="w-full text-center font-headline font-extrabold text-6xl text-primary bg-transparent border-none p-0 placeholder:text-surface-variant" placeholder="0.00" type="number"/>
</div>
</section>
<!-- Concept Area -->
<section class="bg-surface-container-lowest rounded-xl p-6 shadow-[0_12px_40px_rgba(61,64,91,0.04)]">
<label class="font-label text-xs uppercase tracking-widest text-on-surface-variant block mb-3">Concepto</label>
<input class="w-full font-body text-lg text-on-surface bg-surface-container/50 rounded-lg py-4 px-4 border-none placeholder:text-on-surface-variant/50 focus:ring-2 focus:ring-primary-container/30 transition-all" placeholder="Ej. Compra de supermercado" type="text"/>
</section>
<!-- Quick Selection Categories -->
<section>
<div class="flex justify-between items-end mb-4">
<h3 class="font-label text-xs uppercase tracking-widest text-on-surface-variant">Categoría</h3>
<button class="text-primary text-sm font-semibold hover:opacity-80">Ver todas</button>
</div>
<div class="flex overflow-x-auto gap-3 pb-4 snap-x hide-scrollbar" style="scrollbar-width: none;">
<button class="snap-start flex-shrink-0 flex items-center gap-2 bg-primary text-on-primary rounded-full px-5 py-3 shadow-[0_8px_20px_rgba(154,68,45,0.2)]">
<span class="material-symbols-outlined text-[20px]" data-icon="shopping_cart">shopping_cart</span>
<span class="font-body font-medium text-sm">Súper</span>
</button>
<button class="snap-start flex-shrink-0 flex items-center gap-2 bg-surface-container-lowest text-on-surface-variant rounded-full px-5 py-3 border border-outline-variant/30">
<span class="material-symbols-outlined text-[20px]" data-icon="restaurant">restaurant</span>
<span class="font-body font-medium text-sm">Restaurantes</span>
</button>
<button class="snap-start flex-shrink-0 flex items-center gap-2 bg-surface-container-lowest text-on-surface-variant rounded-full px-5 py-3 border border-outline-variant/30">
<span class="material-symbols-outlined text-[20px]" data-icon="bolt">bolt</span>
<span class="font-body font-medium text-sm">Servicios</span>
</button>
<button class="snap-start flex-shrink-0 flex items-center gap-2 bg-surface-container-lowest text-on-surface-variant rounded-full px-5 py-3 border border-outline-variant/30">
<span class="material-symbols-outlined text-[20px]" data-icon="home">home</span>
<span class="font-body font-medium text-sm">Hogar</span>
</button>
</div>
</section>
<!-- Paid By Section -->
<section class="bg-surface-container-low rounded-xl p-6">
<h3 class="font-label text-xs uppercase tracking-widest text-on-surface-variant mb-4">¿Quién pagó?</h3>
<div class="flex gap-4">
<!-- Active Avatar -->
<button class="flex flex-col items-center gap-2 relative">
<div class="w-16 h-16 rounded-full overflow-hidden border-2 border-primary p-[2px]">
<img alt="Avatar Usuario 1" class="w-full h-full object-cover rounded-full" data-alt="Portrait of young woman with dark hair against warm light background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBYAhhbuo-VT1NN8ytSOn9cYHzqoMFcs1Fd4p6BXyhsSUSkrOYsliNC41Ud7sHw48zkYC9cyTJlXlLjr99XGehbD1Xe6_S6MB_CbKO1ePyV3KQQJc8clUOtd3v_XL1PAp7SI-07yivM7NLWMtMdooEL6seES0-tsTulhqnERTtnS9CgYgtY_acS2sMXEYMqqhjEm5a6xx0k4q0zwS2FyHFrKuJVmdlXEooLlXcO27mcD6G4UVFa2CWBKKsUM3Ovqm9tAeqicvM19zQ"/>
</div>
<div class="absolute top-0 right-0 bg-primary text-on-primary rounded-full w-5 h-5 flex items-center justify-center border-2 border-surface-container-low">
<span class="material-symbols-outlined text-[12px]" data-icon="check">check</span>
</div>
<span class="font-body font-medium text-xs text-primary">Tú</span>
</button>
<!-- Inactive Avatar -->
<button class="flex flex-col items-center gap-2 opacity-60 hover:opacity-100 transition-opacity">
<div class="w-16 h-16 rounded-full overflow-hidden border-2 border-transparent">
<img alt="Avatar Usuario 2" class="w-full h-full object-cover rounded-full" data-alt="Portrait of young man looking slightly off camera with soft natural light" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD9DR5VxQyD9n5u79liFUK8-BsqgYsNn66aNN9sv6hbQCVHVvNgICBeo4bPsQfqgvdxvtLT1kWmdJruqPISgQwsic9QdiHdpNj4ILtthwiaoQxznhaKlSdPIZSRN5xap901IK_6WfR7q_b5toWHNlTwRFcDW0TfSxqhDmOoG9JlFxzokb22s7A7czxLQXOJxsvnZfHkgqu9ZLIr_vWdV69xIpRx0nLfYIENTaxx3ocq1DZg6Ehm1B_gSLJxl0O1kvynJfD-liByp5I"/>
</div>
<span class="font-body font-medium text-xs text-on-surface-variant">David</span>
</button>
<!-- Split Button -->
<button class="flex flex-col items-center gap-2 opacity-60 hover:opacity-100 transition-opacity">
<div class="w-16 h-16 rounded-full bg-surface-container-highest text-tertiary flex items-center justify-center border-2 border-transparent border-dashed">
<span class="material-symbols-outlined" data-icon="call_split">call_split</span>
</div>
<span class="font-body font-medium text-xs text-on-surface-variant">Dividir</span>
</button>
</div>
</section><!-- Payment Status Selector -->
<section class="flex flex-col gap-3">
<h3 class="font-label text-xs uppercase tracking-widest text-on-surface-variant">Estado del Pago</h3>
<div class="grid grid-cols-2 gap-3 p-1.5 bg-surface-container-low rounded-2xl">
<button class="flex items-center justify-center gap-2 py-3 px-4 rounded-xl transition-all font-body font-semibold text-sm bg-[#81B29A] text-white shadow-sm">
<span class="material-symbols-outlined text-[20px]" data-icon="check_circle">check_circle</span>
      Pagado
    </button>
<button class="flex items-center justify-center gap-2 py-3 px-4 rounded-xl transition-all font-body font-semibold text-sm bg-surface-container-highest/50 text-on-surface-variant hover:bg-[#E85D75]/10 hover:text-[#E85D75]">
<span class="material-symbols-outlined text-[20px]" data-icon="pending">pending</span>
      Pendiente
    </button>
</div>
</section>
<!-- Date & Note (Compact) -->
<section class="flex gap-4">
<button class="flex-1 bg-surface-container-lowest rounded-xl p-4 flex items-center gap-3 shadow-[0_4px_20px_rgba(61,64,91,0.03)] text-left">
<span class="material-symbols-outlined text-primary-container" data-icon="calendar_today">calendar_today</span>
<div>
<span class="block font-label text-[10px] uppercase tracking-wider text-on-surface-variant">Fecha</span>
<span class="block font-body font-semibold text-on-surface text-sm">Hoy, 24 Oct</span>
</div>
</button>
<button class="flex-1 bg-surface-container-lowest rounded-xl p-4 flex items-center gap-3 shadow-[0_4px_20px_rgba(61,64,91,0.03)] text-left">
<span class="material-symbols-outlined text-primary-container" data-icon="notes">notes</span>
<div>
<span class="block font-label text-[10px] uppercase tracking-wider text-on-surface-variant">Nota</span>
<span class="block font-body font-semibold text-on-surface text-sm opacity-50">Opcional</span>
</div>
</button>
</section>
<!-- Save Action -->
<button class="w-full mt-6 bg-gradient-to-br from-primary to-primary-container text-on-primary rounded-full py-5 px-6 font-headline font-bold text-lg shadow-[0_8px_25px_rgba(154,68,45,0.25)] hover:shadow-[0_12px_30px_rgba(154,68,45,0.35)] transition-all active:scale-95 flex items-center justify-center gap-2">
<span class="material-symbols-outlined" data-icon="check_circle">check_circle</span>
            Guardar Gasto
        </button>
</main>
<!-- Navigation is suppressed due to "Task-Focused" nature (creation flow with Close action) -->
</body></html>
